name: Release

# Triggered by pushing a version tag (v0.1.0, v0.2.0-rc1, ...). Fails up
# front unless the tag matches both places the version lives:
# CFBundleShortVersionString in Packaging/Info.plist (the Mac app) and
# appVersion in android/gradle.properties (the Android app), so a tag
# pushed before a version bump cannot attach 0.1.0-named assets to
# v0.2.0. Release notes are the tag's section of CHANGELOG.md; without
# one, GitHub's generated commit list. A tag with a "-" suffix ("-rc1",
# "-beta1") becomes a pre-release.
#
# Two assets: one universal (arm64 + x86_64) DMG built by scripts/dmg.sh,
# ad-hoc signed (there is no Developer ID for this project, so a first
# launch goes through right-click > Open), one APK signed with the
# release key from the repository secrets, the same identity the
# developer's other Android apps use, and the AAB from the same build
# and key for the Play Console upload. Idempotent: re-pushing the tag
# updates the notes and replaces the assets instead of failing.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Verify the tag & create the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tag matches Info.plist and gradle.properties
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          MAC_VERSION=$(python3 -c 'import plistlib,sys; print(plistlib.load(open("Packaging/Info.plist","rb"))["CFBundleShortVersionString"])')
          ANDROID_VERSION=$(grep '^appVersion=' android/gradle.properties | cut -d= -f2)
          TAG_VERSION="${TAG#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"
          if [[ "$TAG_VERSION" != "$MAC_VERSION" ]]; then
            echo "::error::tag $TAG does not match CFBundleShortVersionString=$MAC_VERSION in Packaging/Info.plist"
            exit 1
          fi
          if [[ "$TAG_VERSION" != "$ANDROID_VERSION" ]]; then
            echo "::error::tag $TAG does not match appVersion=$ANDROID_VERSION in android/gradle.properties"
            exit 1
          fi
          echo "version=$MAC_VERSION" >> "$GITHUB_OUTPUT"

      # Section body without its heading (the release title is the tag),
      # leading and trailing blank lines stripped.
      - name: Create or update the release (no assets yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="$RUNNER_TEMP/release-notes.md"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; found = (index($0, "## [" v "]") == 1); next }
            found
          ' CHANGELOG.md | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > "$NOTES"
          args=(--title "$TAG" --repo "${{ github.repository }}")
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          if [[ -s "$NOTES" ]]; then
            echo "release notes: CHANGELOG.md section [$VERSION]"
          else
            echo "::warning::CHANGELOG.md has no [$VERSION] section, using generated notes"
            rm -f "$NOTES"
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $TAG exists - updating notes, assets will be replaced"
            if [[ -f "$NOTES" ]]; then
              gh release edit "$TAG" "${args[@]}" --notes-file "$NOTES"
            else
              gh release edit "$TAG" "${args[@]}"
            fi
          else
            if [[ -f "$NOTES" ]]; then
              args+=(--notes-file "$NOTES")
            else
              args+=(--generate-notes)
            fi
            gh release create "$TAG" "${args[@]}"
          fi

  macos:
    name: Build the DMG
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Test
        run: swift test

      - name: Build universal DMG
        run: scripts/dmg.sh --universal

      - name: Upload the DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "build/Crate-${{ needs.create-release.outputs.version }}.dmg" --clobber --repo "${{ github.repository }}"

  android:
    name: Build & sign the APK and AAB
    needs: create-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # packages: platform-tools only. The action's default ("tools
      # platform-tools") requests the legacy 'tools' package, which Google
      # removed from the SDK repository, and the step fails. The platform
      # the app compiles against is installed explicitly; AGP fetches the
      # build tools it wants itself (the action accepted the licenses).
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install the Android platform
        run: sdkmanager --install "platforms;android-37.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests
        run: ./gradlew :core:test

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # app/build.gradle.kts picks the signing config up from these
      # variables; without them it would build an unsigned APK, which
      # must never reach a release, hence the check on the output name.
      - name: Build the signed release APK and AAB
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          if [[ ! -f "$APK" ]]; then
            echo "::error::no signed APK (signing secrets missing?); found: $(ls app/build/outputs/apk/release)"
            exit 1
          fi
          cp "$APK" "Crate-${{ needs.create-release.outputs.version }}.apk"
          # The bundle task names its output the same with or without
          # signing, and jarsigner -verify exits 0 for an unsigned file,
          # so look for the signature block itself.
          AAB=app/build/outputs/bundle/release/app-release.aab
          if ! unzip -l "$AAB" | grep -qE 'META-INF/[^/]+\.(RSA|EC|DSA)$'; then
            echo "::error::the AAB is not signed (signing secrets missing?)"
            exit 1
          fi
          cp "$AAB" "Crate-${{ needs.create-release.outputs.version }}.aab"

      - name: Upload the APK and AAB to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "Crate-${{ needs.create-release.outputs.version }}.apk" "Crate-${{ needs.create-release.outputs.version }}.aab" --clobber --repo "${{ github.repository }}"
