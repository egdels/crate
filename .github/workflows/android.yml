name: Android

# Runs the core library's JVM tests, lint, and builds the debug APK on
# every push that touches the Android app. The APK is debug-signed and
# only an artifact of the run; the signed release APK is built by
# release.yml when a version tag is pushed.

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Test, lint & build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # packages: platform-tools only. The action's default ("tools
      # platform-tools") requests the legacy 'tools' package, which Google
      # removed from the SDK repository, and the step fails. The platform
      # the app compiles against is installed explicitly; AGP fetches the
      # build tools it wants itself (the action accepted the licenses).
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install the Android platform
        run: sdkmanager --install "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests
        run: ./gradlew :core:test
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Crate-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
